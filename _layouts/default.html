<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Roboto+Slab:wght@300;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
</head>
<body>
  <header class="ei-header">
    <a href="{{ '/' | relative_url }}" class="logo-wrap" aria-label="Engaged Inquiry">
      <img class="logo" src="{{ '/assets/images/logo.svg' | relative_url }}" alt="Engaged Inquiry">
    </a>
    <span class="tagline">{{ site.tagline }}</span>
  </header>

  <main class="content">
    {{ content }}
  </main>

  <footer class="ei-footer">
    <p>{{ site.title }} — CC BY 4.0</p>
  </footer>
</body>
</html>
